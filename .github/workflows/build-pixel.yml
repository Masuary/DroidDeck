name: Build Pixel experimental APK

on:
  push:
    branches: [pixel-powervr]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gamescope:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: gamescope-cache
        with:
          path: |
            gamescope.tzst
            gamescope.tzst.sha256
          key: pixel-gamescope-v1-${{ hashFiles('tools/gamescope/**') }}
      - name: Build gamescope with the Pixel Venus patches
        if: steps.gamescope-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work menci/archlinuxarm:base-devel bash tools/gamescope/build-in-arch.sh
          sudo chown -R "$(id -u):$(id -g)" gamescope.tzst gamescope.tzst.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-gamescope
          path: |
            gamescope.tzst
            gamescope.tzst.sha256
          if-no-files-found: error

  apk:
    needs: gamescope
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DROIDDECK_BUILD_LABEL: pixel-experimental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: pixel-gamescope
          path: pixel-components
      - name: Resolve Android NDK and install cross compiler
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          test -f "$NDK/source.properties"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          sed -n 's/^Pkg.Revision *= */NDK_VERSION=/p' "$NDK/source.properties" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu zstd
      - name: Stage verified upstream dependencies and rebuilt gamescope
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o upstream.apk https://github.com/Droid-Deck/DroidDeck/releases/download/0.3.1/DroidDeck-0.3.1.apk
          python3 tools/venus/stage-pixel-dependencies.py upstream.apk
          (cd pixel-components && sha256sum -c gamescope.tzst.sha256)
          tar --use-compress-program=unzstd -xf pixel-components/gamescope.tzst -C app/src/main/assets/linuxfs
          # The Pixel branch changes DRM handling in this preload; rebuild it from this checkout.
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -pthread \
            -o app/src/main/assets/linuxfs/libblsession.so tools/linuxfs/preload/*.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded app/src/main/assets/linuxfs/libblsession.so
      - name: Build the branch's audio sinks
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o pa.tar.gz https://github.com/pulseaudio/pulseaudio/archive/refs/tags/v13.0.tar.gz
          mkdir pa13 pa-bundle
          tar -xzf pa.tar.gz -C pa13 --strip-components=1
          tools/aaudio-sink/build.sh "$PWD/pa13" "$PWD/sink-out"
          tar --use-compress-program=unzstd -xf app/src/main/assets/pulseaudio.tzst -C pa-bundle
          install -m755 sink-out/module-aaudio-sink.so pa-bundle/modules/arm64/module-aaudio-sink.so
          install -m755 sink-out/module-directaudio-sink.so pa-bundle/modules/arm64/module-directaudio-sink.so
          (cd pa-bundle && tar --use-compress-program='zstd -19' -cf ../pixel-audio.tzst .)
          mv pixel-audio.tzst app/src/main/assets/pulseaudio.tzst
      - name: Build APK and run unit tests
        run: |
          set -euo pipefail
          ./gradlew assembleDebug testDebugUnitTest --console=plain -PndkVersion="$NDK_VERSION"
          python3 tools/release/check_session_assets.py app/build/outputs/apk/debug/app-debug.apk
      - name: Check Pixel package and required runtime components
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > pixel-package.txt
          grep -F "name='com.droiddeck.launcher.pixel'" pixel-package.txt
          "$APKSIGNER" verify --verbose "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              for name in ['lib/arm64-v8a/libvenusserver.so', 'assets/venus/libvulkan_virtio.so',
                           'lib/arm64-v8a/libproot.so', 'assets/linuxfs/usr/local/bin/gamescope']:
                  assert apk.getinfo(name).file_size > 0, name
          PY
          mkdir pixel-output
          cp "$APK" pixel-output/DroidDeck-Pixel-experimental.apk
          sha256sum pixel-output/DroidDeck-Pixel-experimental.apk > pixel-output/SHA256SUMS.txt
          cp docs/pixel-venus.md pixel-output/KNOWN-LIMITATIONS.md
          printf 'Source commit: %s\nBase port: gogetwoo/DroidDeck pixel-venus\n' "$GITHUB_SHA" > pixel-output/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DroidDeck-Pixel-experimental
          path: pixel-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-build-reports
          path: |
            app/build/reports/
            pixel-package.txt
          if-no-files-found: ignore
